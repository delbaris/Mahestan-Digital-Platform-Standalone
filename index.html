<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>مجتمع تجاری مهستان کرج | پلتفرم دیجیتال یکپارچه</title>
    <meta name="description" content="پلتفرم یکپارچه مجتمع تجاری مهستان کرج؛ پرتال مالکین، هیئت‌مدیره و مدیریت" />
    <meta name="theme-color" content="#0A1828" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"
        type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* =========================================================
   MAHESTAN DESIGN SYSTEM v3 - Premium Persian Commercial RE
   بهینه‌شده برای موبایل، تبلت، لپ‌تاپ و دسکتاپ
========================================================= */
        :root {
            --c-navy-900: #0A1828;
            --c-navy-800: #0F1F38;
            --c-navy-700: #152A47;
            --c-charcoal: #1E293B;
            --c-slate-700: #334155;
            --c-slate-500: #64748B;
            --c-slate-400: #94A3B8;
            --c-slate-200: #E2E8F0;
            --c-slate-100: #F1F5F9;
            --c-ivory: #FAF9F6;
            --c-white: #FFFFFF;
            --c-gold: #C9A96E;
            --c-gold-600: #B8925A;
            --c-gold-400: #E2C994;
            --c-gold-100: #F7F0E2;
            --c-success: #0F8F6A;
            --c-success-50: #E6F5EF;
            --c-warning: #D97706;
            --c-warning-50: #FEF3C7;
            --c-error: #C8323A;
            --c-error-50: #FEE2E2;
            --c-info: #2563EB;
            --c-info-50: #DBEAFE;
            --font-sans: 'Vazirmatn', 'Segoe UI', 'Tahoma', system-ui, sans-serif;
            --r-sm: 8px;
            --r-md: 12px;
            --r-lg: 16px;
            --r-xl: 24px;
            --shadow-sm: 0 1px 2px rgba(15, 24, 40, .06);
            --shadow-md: 0 4px 12px rgba(15, 24, 40, .08);
            --shadow-lg: 0 12px 32px rgba(15, 24, 40, .12);
            --shadow-xl: 0 24px 48px rgba(15, 24, 40, .18);
            --sidebar-w: 280px;
            --sidebar-w-collapsed: 82px;
            --header-h: 70px;
            --content-max: 1440px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --focus-ring: 0 0 0 3px rgba(201, 169, 110, .24);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%
        }

        body {
            font-family: var(--font-sans);
            background: var(--c-ivory);
            color: var(--c-navy-900);
            line-height: 1.7;
            font-size: 14px;
            min-height: 100vh;
            overflow-x: hidden;
            min-width: 320px;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit
        }

        input,
        select,
        textarea {
            font-family: inherit;
            font-size: 14px;
            color: inherit
        }

        ul {
            list-style: none
        }

        img {
            max-width: 100%;
            display: block
        }

        ::selection {
            background: var(--c-gold-100);
            color: var(--c-navy-900)
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        [tabindex]:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
            border-radius: var(--r-sm);
        }

        .skip-link {
            position: absolute;
            top: -48px;
            right: 12px;
            z-index: 2000;
            background: var(--c-navy-900);
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            transition: top .2s;
        }

        .skip-link:focus {
            top: 12px
        }

        .container {
            width: 100%;
            max-width: var(--content-max);
            margin-inline: auto;
            padding-inline: 24px
        }

        .muted {
            color: var(--c-slate-500);
            font-size: 13px
        }

        .small {
            font-size: 12px
        }

        .text-center {
            text-align: center
        }

        .w-full {
            width: 100%
        }

        .h1 {
            font-size: clamp(28px, 4vw, 36px);
            font-weight: 800;
            line-height: 1.25
        }

        .h2 {
            font-size: clamp(22px, 3vw, 28px);
            font-weight: 800;
            line-height: 1.3
        }

        .h3 {
            font-size: clamp(18px, 2.2vw, 21px);
            font-weight: 700
        }

        .h4 {
            font-size: 16px;
            font-weight: 700
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.6;
            white-space: nowrap;
        }

        .badge-gold {
            background: var(--c-gold-100);
            color: var(--c-gold-600)
        }

        .badge-success {
            background: var(--c-success-50);
            color: var(--c-success)
        }

        .badge-warning {
            background: var(--c-warning-50);
            color: var(--c-warning)
        }

        .badge-error {
            background: var(--c-error-50);
            color: var(--c-error)
        }

        .badge-info {
            background: var(--c-info-50);
            color: var(--c-info)
        }

        .badge-slate {
            background: var(--c-slate-100);
            color: var(--c-slate-700)
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 42px;
            padding: 10px 18px;
            border-radius: var(--r-md);
            font-weight: 700;
            font-size: 14px;
            line-height: 1.4;
            border: 1px solid transparent;
            white-space: nowrap;
            transition: transform .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease, border-color .16s ease;
            touch-action: manipulation;
        }

        .btn:active {
            transform: translateY(1px) scale(.99)
        }

        .btn:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
            box-shadow: none
        }

        .btn-primary {
            background: var(--c-navy-800);
            color: #fff
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--c-navy-700)
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--c-gold), var(--c-gold-600));
            color: #fff
        }

        .btn-gold:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(201, 169, 110, .35)
        }

        .btn-ghost {
            background: transparent;
            color: var(--c-navy-800);
            border-color: var(--c-slate-200)
        }

        .btn-ghost:hover:not(:disabled) {
            background: var(--c-slate-100)
        }

        .btn-success {
            background: var(--c-success);
            color: #fff
        }

        .btn-success:hover:not(:disabled) {
            filter: brightness(.98)
        }

        .btn-outline {
            border-color: var(--c-navy-800);
            color: var(--c-navy-800);
            background: transparent
        }

        .btn-outline:hover:not(:disabled) {
            background: var(--c-navy-800);
            color: #fff
        }

        .btn-danger {
            background: var(--c-error-50);
            color: var(--c-error);
            border-color: transparent
        }

        .btn-danger:hover:not(:disabled) {
            background: var(--c-error);
            color: #fff
        }

        .btn-sm {
            min-height: 36px;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 10px
        }

        .btn-lg {
            min-height: 50px;
            padding: 14px 26px;
            font-size: 16px;
            border-radius: 14px
        }

        .btn-block {
            width: 100%
        }

        .btn-icon {
            padding: 0;
            width: 42px;
            height: 42px
        }

        .input,
        .select,
        .textarea {
            width: 100%;
            min-height: 44px;
            padding: 10px 14px;
            border: 1.5px solid var(--c-slate-200);
            border-radius: var(--r-md);
            background: #fff;
            transition: border-color .15s, box-shadow .15s;
        }

        .textarea {
            min-height: 96px;
            resize: vertical
        }

        .input:focus,
        .select:focus,
        .textarea:focus {
            outline: none;
            border-color: var(--c-gold);
            box-shadow: var(--focus-ring);
        }

        .label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
            color: var(--c-slate-700)
        }

        .form-group {
            margin-bottom: 16px
        }

        .form-help {
            font-size: 11px;
            color: var(--c-slate-500);
            margin-top: 6px
        }

        .card {
            background: #fff;
            border-radius: var(--r-lg);
            padding: 22px;
            border: 1px solid rgba(226, 232, 240, .9);
            box-shadow: var(--shadow-sm);
            min-width: 0;
        }

        .card-hover {
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
            cursor: pointer
        }

        .card-hover:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--c-gold-400)
        }

        .card-title {
            font-size: 13px;
            color: var(--c-slate-500);
            margin-bottom: 8px;
            font-weight: 600
        }

        .card-value {
            font-size: clamp(22px, 2.4vw, 29px);
            font-weight: 800;
            line-height: 1.25;
            word-break: break-word
        }

        .chart-box {
            position: relative;
            height: 290px;
            width: 100%;
            min-width: 0
        }

        .chart-box canvas {
            max-width: 100%
        }

        .photo {
            position: relative;
            border-radius: var(--r-lg);
            overflow: hidden;
            min-height: 220px;
            background: linear-gradient(135deg, var(--c-slate-100), var(--c-slate-200));
        }

        .photo::before {
            content: "تصویر واقعی مجتمع مهستان — در نبود تصویر، این جای‌نمایش نمایش داده می‌شود";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--c-slate-500);
            font-size: 12px;
            padding: 16px;
            text-align: center;
        }

        .photo img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .photo img.img-missing {
            display: none
        }

        .photo figcaption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 2;
            padding: 28px 14px 10px;
            font-size: 12px;
            color: #fff;
            background: linear-gradient(transparent, rgba(10, 24, 40, .86));
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
            gap: 16px
        }

        .spinner {
            width: 18px;
            height: 18px;
            display: inline-block;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .4);
            border-top-color: #fff;
            animation: spin .8s linear infinite;
        }

        .spinner.dark {
            border-color: var(--c-slate-200);
            border-top-color: var(--c-gold)
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(18px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes slideInR {
            from {
                opacity: 0;
                transform: translateX(-24px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes floatBadge {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-4px)
            }
        }

        /* Public header */
        .public-header {
            position: sticky;
            top: 0;
            z-index: 120;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--c-slate-100);
        }

        .public-nav {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            min-height: var(--header-h);
            padding-inline: 24px;
            max-width: var(--content-max);
            margin-inline: auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 17px;
            color: var(--c-navy-900);
            min-width: max-content
        }

        .logo-mark {
            width: 40px;
            height: 40px;
            flex: 0 0 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--c-navy-800), var(--c-charcoal));
            color: var(--c-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: 800;
            box-shadow: var(--shadow-sm);
        }

        .logo-sub {
            font-size: 9.5px;
            color: var(--c-slate-500);
            font-weight: 700;
            letter-spacing: .08em
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none
        }

        .nav-links::-webkit-scrollbar {
            display: none
        }

        .nav-links a {
            padding: 9px 13px;
            border-radius: 10px;
            font-size: 14px;
            color: var(--c-slate-700);
            font-weight: 600;
            white-space: nowrap;
            transition: .15s;
            cursor: pointer;
        }

        .nav-links a:hover {
            background: var(--c-slate-100);
            color: var(--c-navy-900)
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-inline-start: auto
        }

        .public-menu-toggle {
            display: none
        }

        /* Hero */
        .hero {
            position: relative;
            color: #fff;
            overflow: hidden;
            background-color: var(--c-navy-900);
            background-image: linear-gradient(135deg, rgba(10, 24, 40, .94), rgba(10, 24, 40, .56) 55%, rgba(10, 24, 40, .82)), url('images/mahestan-1.jpg');
            background-size: cover;
            background-position: center bottom;
            padding: 108px 0 40px;
        }

        .hero-inner {
            position: relative;
            z-index: 2;
            max-width: 820px;
            padding-inline: 24px;
            margin-inline: auto;
            text-align: center
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 15px;
            margin-bottom: 22px;
            background: rgba(201, 169, 110, .16);
            border: 1px solid rgba(201, 169, 110, .32);
            border-radius: 999px;
            color: var(--c-gold-400);
            font-size: 13px;
            font-weight: 600;
        }

        .hero h1 {
            font-size: clamp(31px, 6.4vw, 58px);
            font-weight: 900;
            line-height: 1.22;
            letter-spacing: -.02em;
            margin-bottom: 18px;
        }

        .hero h1 span {
            background: linear-gradient(135deg, var(--c-gold-400), var(--c-gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero p {
            font-size: clamp(15px, 2vw, 18px);
            color: rgba(255, 255, 255, .8);
            max-width: 700px;
            margin: 0 auto 32px
        }

        .hero-ctas {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap
        }

        .hero-stats {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            max-width: 1100px;
            margin: 42px auto 0;
            padding-inline: 24px;
        }

        .hero-stat {
            padding: 16px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, .07);
            border: 1px solid rgba(255, 255, 255, .12);
            backdrop-filter: blur(12px);
            text-align: center;
        }

        .hero-stat-num {
            font-size: clamp(20px, 2.6vw, 28px);
            font-weight: 800;
            color: var(--c-gold-400)
        }

        .hero-stat-lbl {
            font-size: 12px;
            color: rgba(255, 255, 255, .72);
            margin-top: 4px
        }

        .demo-badge {
            position: fixed;
            bottom: calc(16px + var(--safe-bottom));
            left: 16px;
            z-index: 998;
            background: var(--c-gold);
            color: #fff;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            box-shadow: var(--shadow-lg);
            animation: floatBadge 3.5s ease-in-out infinite;
        }

        .section {
            padding: 84px 0
        }

        .section-title {
            text-align: center;
            margin-bottom: 44px
        }

        .section-title .kicker {
            color: var(--c-gold-600);
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 8px;
            letter-spacing: .09em;
            text-transform: uppercase;
        }

        .section-title h2 {
            font-size: clamp(24px, 3.4vw, 34px);
            font-weight: 800;
            color: var(--c-navy-900)
        }

        .stores-filter {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 26px
        }

        .chip,
        .floor-tab,
        .finance-tab {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 8px 16px;
            border-radius: 999px;
            background: #fff;
            border: 1px solid var(--c-slate-200);
            font-size: 13px;
            color: var(--c-slate-700);
            font-weight: 600;
            cursor: pointer;
            transition: .16s;
        }

        .chip:hover,
        .floor-tab:hover,
        .finance-tab:hover {
            border-color: var(--c-gold)
        }

        .chip.active,
        .floor-tab.active,
        .finance-tab.active {
            background: var(--c-navy-800);
            color: #fff;
            border-color: var(--c-navy-800);
        }

        .finance-tab {
            border-radius: 12px
        }

        .stores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(245px, 100%), 1fr));
            gap: 20px
        }

        .store-card {
            background: #fff;
            border-radius: var(--r-lg);
            overflow: hidden;
            border: 1px solid var(--c-slate-100);
            transition: .22s;
            cursor: pointer;
            min-width: 0;
        }

        .store-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--c-gold-400)
        }

        .store-thumb {
            height: 158px;
            background: linear-gradient(135deg, var(--c-slate-100), var(--c-slate-200));
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .store-thumb::after {
            content: "تصویر نمونه";
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(10, 24, 40, .62);
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
        }

        .store-logo {
            position: absolute;
            top: -24px;
            right: 16px;
            width: 64px;
            height: 64px;
            z-index: 2;
            border-radius: 14px;
            background: #fff;
            color: var(--c-navy-800);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 19px;
            box-shadow: var(--shadow-md);
            border: 2px solid #fff;
        }

        .store-body {
            padding: 20px;
            padding-top: 36px
        }

        .store-name {
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 4px
        }

        .store-cat {
            color: var(--c-slate-500);
            font-size: 12px;
            margin-bottom: 10px
        }

        .store-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--c-slate-500);
            border-top: 1px solid var(--c-slate-100);
            padding-top: 12px;
            margin-top: 8px;
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr));
            gap: 18px
        }

        .kpi {
            background: #fff;
            padding: 26px 18px;
            border-radius: var(--r-lg);
            border: 1px solid var(--c-slate-100);
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .kpi-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            margin: 0 auto 14px;
            background: linear-gradient(135deg, var(--c-gold-100), var(--c-gold-400));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--c-gold-600);
        }

        .kpi-num {
            font-size: 28px;
            font-weight: 800;
            color: var(--c-navy-900)
        }

        .kpi-lbl {
            color: var(--c-slate-500);
            font-size: 13px;
            margin-top: 4px
        }

        .footer {
            background: var(--c-navy-900);
            color: rgba(255, 255, 255, .72);
            padding: 58px 0 24px
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 34px;
            margin-bottom: 32px
        }

        .footer h4 {
            color: #fff;
            font-size: 15px;
            margin-bottom: 15px
        }

        .footer a {
            display: block;
            padding: 5px 0;
            color: rgba(255, 255, 255, .66);
            font-size: 13px;
            cursor: pointer;
            transition: .15s
        }

        .footer a:hover {
            color: var(--c-gold-400)
        }

        .footer-bottom {
            padding-top: 22px;
            border-top: 1px solid rgba(255, 255, 255, .1);
            font-size: 12px;
            text-align: center
        }

        /* Auth */
        .auth-wrap {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1.05fr 1fr
        }

        .auth-visual {
            background-color: var(--c-navy-900);
            background-image: linear-gradient(160deg, rgba(10, 24, 40, .95), rgba(15, 31, 56, .88)), url('images/mahestan-2.jpg');
            background-size: cover;
            background-position: center;
            color: #fff;
            padding: 44px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .auth-visual-content {
            position: relative;
            z-index: 2;
            max-width: 430px
        }

        .auth-visual h2 {
            font-size: clamp(26px, 3vw, 34px);
            margin-bottom: 14px;
            line-height: 1.35
        }

        .auth-visual p {
            color: rgba(255, 255, 255, .76);
            font-size: 15px
        }

        .auth-features {
            margin-top: 30px;
            display: grid;
            gap: 14px
        }

        .auth-feature {
            display: flex;
            gap: 12px;
            align-items: flex-start
        }

        .auth-feature-icon {
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            border-radius: 11px;
            background: rgba(201, 169, 110, .16);
            color: var(--c-gold-400);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-form-wrap {
            padding: 42px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fff
        }

        .auth-form {
            max-width: 420px;
            margin: 0 auto;
            width: 100%
        }

        .auth-form h1 {
            font-size: 28px;
            margin-bottom: 8px
        }

        .auth-form .sub {
            color: var(--c-slate-500);
            margin-bottom: 28px
        }

        .otp-boxes {
            display: flex;
            gap: 10px;
            direction: ltr;
            justify-content: center;
            margin: 24px 0
        }

        .otp-box {
            width: 52px;
            height: 58px;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            border: 2px solid var(--c-slate-200);
            border-radius: 12px;
            background: #fff;
        }

        .otp-box:focus {
            border-color: var(--c-gold);
            outline: none;
            box-shadow: var(--focus-ring)
        }

        .demo-hint {
            background: var(--c-gold-100);
            color: var(--c-gold-600);
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.9;
            text-align: center;
            margin-top: 16px;
            border: 1px dashed var(--c-gold-400);
        }

        /* Portal layout */
        .portal-layout {
            display: grid;
            grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
            min-height: 100vh;
            transition: grid-template-columns .24s ease;
        }

        .portal-layout.sidebar-collapsed {
            grid-template-columns: var(--sidebar-w-collapsed) minmax(0, 1fr)
        }

        .sidebar {
            background: #fff;
            border-left: 1px solid var(--c-slate-100);
            position: sticky;
            top: 0;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 200;
        }

        .sidebar-header {
            padding: 14px 12px;
            border-bottom: 1px solid var(--c-slate-100);
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: var(--header-h);
        }

        .sidebar-header .logo {
            flex: 1;
            min-width: 0;
            cursor: pointer
        }

        .sidebar-header .logo>div:last-child {
            min-width: 0;
            overflow: hidden
        }

        .sidebar-header .logo div:first-child {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px
        }

        .sidebar-scroll {
            flex: 1;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 12px;
            scrollbar-width: thin
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--c-slate-100);
            display: grid;
            gap: 6px
        }

        .sidebar-section {
            margin-bottom: 16px
        }

        .sidebar-title {
            font-size: 10.5px;
            font-weight: 800;
            color: var(--c-slate-400);
            padding: 8px 12px 6px;
            letter-spacing: .09em;
        }

        .sidebar-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 11px;
            color: var(--c-slate-700);
            font-size: 13.5px;
            font-weight: 600;
            margin-bottom: 3px;
            transition: .15s;
            text-align: right;
        }

        .sidebar-item:hover {
            background: var(--c-slate-100);
            color: var(--c-navy-900)
        }

        .sidebar-item.active {
            background: linear-gradient(135deg, var(--c-navy-800), var(--c-navy-700));
            color: #fff;
            box-shadow: var(--shadow-sm);
        }

        .sidebar-item .ico {
            width: 20px;
            flex: 0 0 20px;
            text-align: center;
            font-size: 16px;
            line-height: 1
        }

        .sidebar-item .label {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .sidebar-item .count {
            background: var(--c-error);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 999px;
            flex: 0 0 auto;
        }

        .sidebar-item.active .count {
            background: var(--c-gold);
            color: var(--c-navy-900)
        }

        .sidebar-collapse-btn {
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            border-radius: 10px;
            background: var(--c-slate-100);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .15s;
        }

        .sidebar-collapse-btn:hover {
            background: var(--c-slate-200)
        }

        .portal-layout.sidebar-collapsed .sidebar .label,
        .portal-layout.sidebar-collapsed .sidebar-title,
        .portal-layout.sidebar-collapsed .logo-text,
        .portal-layout.sidebar-collapsed .count,
        .portal-layout.sidebar-collapsed .sidebar-footer .sidebar-item span:not(.ico) {
            display: none
        }

        .portal-layout.sidebar-collapsed .sidebar-item {
            justify-content: center;
            padding: 11px 8px
        }

        .portal-layout.sidebar-collapsed .sidebar-header {
            justify-content: center;
            padding-inline: 8px
        }

        .portal-layout.sidebar-collapsed .sidebar-collapse-btn {
            display: none
        }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 24, 40, .46);
            backdrop-filter: blur(2px);
            z-index: 190;
        }

        .sidebar-backdrop.open {
            display: block
        }

        .portal-main {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 100vh
        }

        .topbar {
            background: rgba(255, 255, 255, .94);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--c-slate-100);
            padding-inline: 24px;
            min-height: var(--header-h);
            display: flex;
            align-items: center;
            gap: 14px;
            position: sticky;
            top: 0;
            z-index: 100;
            min-width: 0;
        }

        .topbar .breadcrumb {
            color: var(--c-slate-500);
            font-size: 13px;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .topbar .breadcrumb strong {
            color: var(--c-navy-900)
        }

        .topbar-right {
            margin-inline-start: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0
        }

        .global-search {
            position: relative;
            min-width: 0
        }

        .global-search input {
            width: min(320px, 32vw);
            min-height: 42px;
            padding: 8px 38px 8px 14px;
            border-radius: 12px;
            background: var(--c-slate-100);
            border: 1px solid transparent;
            transition: .15s;
        }

        .global-search input:focus {
            background: #fff;
            border-color: var(--c-gold);
            box-shadow: var(--focus-ring);
            outline: none
        }

        .global-search::before {
            content: "🔍";
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            opacity: .55;
            pointer-events: none;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 12px;
            background: var(--c-slate-100);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: .15s;
            font-size: 16px;
        }

        .icon-btn:hover {
            background: var(--c-slate-200)
        }

        .icon-btn .dot {
            position: absolute;
            top: 9px;
            right: 9px;
            width: 9px;
            height: 9px;
            background: var(--c-error);
            border-radius: 50%;
            border: 2px solid #fff;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 12px 5px 6px;
            border-radius: 999px;
            background: var(--c-slate-100);
            transition: .15s;
            max-width: 220px;
        }

        .user-chip:hover {
            background: var(--c-slate-200)
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            flex: 0 0 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--c-navy-800), var(--c-charcoal));
            color: var(--c-gold-400);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12.5px;
        }

        .user-chip .name {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .user-chip .role {
            font-size: 11px;
            color: var(--c-slate-500);
            white-space: nowrap
        }

        .page {
            padding: 26px;
            flex: 1;
            width: 100%;
            min-width: 0
        }

        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .page-title {
            font-size: clamp(21px, 2.6vw, 26px);
            font-weight: 800;
            color: var(--c-navy-900)
        }

        .page-subtitle {
            color: var(--c-slate-500);
            font-size: 13px;
            margin-top: 5px
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(225px, 100%), 1fr));
            gap: 16px;
            margin-bottom: 22px;
        }

        .action-banner {
            background: linear-gradient(135deg, var(--c-navy-800), var(--c-navy-900));
            color: #fff;
            padding: 22px;
            border-radius: var(--r-lg);
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            box-shadow: var(--shadow-md);
        }

        .action-banner-icon {
            width: 56px;
            height: 56px;
            flex: 0 0 56px;
            border-radius: 16px;
            background: rgba(201, 169, 110, .2);
            color: var(--c-gold-400);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .action-banner h3 {
            font-size: 18px;
            margin-bottom: 4px
        }

        .action-banner p {
            color: rgba(255, 255, 255, .76);
            font-size: 13px
        }

        .content-grid {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
            gap: 18px;
        }

        .table-wrap {
            background: #fff;
            border-radius: var(--r-lg);
            border: 1px solid var(--c-slate-100);
            overflow: auto;
            overscroll-behavior-inline: contain;
            min-width: 0;
        }

        .table-toolbar {
            padding: 15px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--c-slate-100);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px
        }

        .table th {
            text-align: right;
            padding: 12px 18px;
            background: var(--c-slate-100);
            font-size: 12px;
            font-weight: 700;
            color: var(--c-slate-500);
            white-space: nowrap;
            position: sticky;
            top: 0;
        }

        .table td {
            padding: 13px 18px;
            border-top: 1px solid var(--c-slate-100);
            font-size: 13px;
            vertical-align: middle;
            white-space: nowrap;
        }

        .table tbody tr {
            transition: .12s
        }

        .table tbody tr:hover td {
            background: var(--c-slate-100)
        }

        /* Modal */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(10, 24, 40, .55);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 18px;
            animation: fadeIn .2s;
            overscroll-behavior: contain;
        }

        .modal {
            background: #fff;
            border-radius: var(--r-xl);
            max-width: 560px;
            width: 100%;
            max-height: calc(100dvh - 32px);
            overflow: auto;
            animation: slideUp .24s;
            overscroll-behavior: contain;
        }

        .modal.modal-wide {
            max-width: 880px
        }

        .modal-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--c-slate-100);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 2;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800
        }

        .modal-body {
            padding: 22px
        }

        .modal-footer {
            padding: 16px 22px;
            padding-bottom: calc(16px + var(--safe-bottom));
            border-top: 1px solid var(--c-slate-100);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
            position: sticky;
            bottom: 0;
            background: #fff;
            z-index: 2;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: calc(18px + var(--safe-bottom));
            left: 18px;
            z-index: 1200;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: min(380px, calc(100vw - 36px));
        }

        .toast {
            background: #fff;
            border-radius: 14px;
            padding: 13px 16px;
            box-shadow: var(--shadow-lg);
            display: flex;
            gap: 11px;
            align-items: center;
            width: 100%;
            border-right: 4px solid var(--c-success);
            animation: slideInR .28s;
            font-size: 13px;
            font-weight: 600;
        }

        .toast.error {
            border-right-color: var(--c-error)
        }

        .toast.info {
            border-right-color: var(--c-info)
        }

        /* DCC */
        .dcc {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 900;
            background: #fff;
            border-radius: 16px;
            box-shadow: var(--shadow-xl);
            padding: 14px;
            border: 1px solid var(--c-slate-200);
            width: min(285px, calc(100vw - 36px));
            max-height: min(88vh, 720px);
            overflow: auto;
        }

        .dcc.min {
            width: auto;
            padding: 0;
            border: none;
            background: none;
            box-shadow: none
        }

        .dcc-toggle {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--c-navy-800), var(--c-charcoal));
            color: var(--c-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            box-shadow: var(--shadow-lg);
        }

        .dcc h4 {
            font-size: 13px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .dcc-role {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px
        }

        .dcc-role button {
            padding: 8px 11px;
            border-radius: 10px;
            text-align: right;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid var(--c-slate-100);
            background: #fff;
            color: var(--c-slate-700);
            transition: .14s;
        }

        .dcc-role button:hover {
            background: var(--c-slate-100)
        }

        .dcc-role button.active {
            background: var(--c-navy-800);
            color: #fff;
            border-color: var(--c-navy-800)
        }

        .dcc-section {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            background: var(--c-slate-100);
            margin-bottom: 4px;
            cursor: pointer;
            display: block;
            text-align: right;
            font-size: 11.5px;
            font-weight: 600;
            transition: .14s;
        }

        .dcc-section:hover {
            background: var(--c-gold-100);
            color: var(--c-gold-600)
        }

        .dcc-divider {
            padding-top: 9px;
            border-top: 1px solid var(--c-slate-100);
            margin-top: 8px
        }

        /* Timeline / map */
        .timeline {
            position: relative;
            padding-right: 28px
        }

        .timeline::before {
            content: "";
            position: absolute;
            right: 8px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: var(--c-slate-200);
        }

        .timeline-item {
            position: relative;
            padding-bottom: 20px
        }

        .timeline-item::before {
            content: "";
            position: absolute;
            right: -28px;
            top: 6px;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--c-gold);
            z-index: 2;
        }

        .timeline-item.current::before {
            background: var(--c-gold)
        }

        .timeline-card {
            background: #fff;
            border: 1px solid var(--c-slate-100);
            border-radius: 13px;
            padding: 16px
        }

        .floor-tabs {
            display: flex;
            gap: 7px;
            margin-bottom: 16px;
            flex-wrap: wrap
        }

        .floor-map {
            background: #fff;
            border-radius: var(--r-lg);
            border: 1px solid var(--c-slate-100);
            padding: 20px;
            position: relative;
            height: 420px;
            overflow: auto;
            background-image: linear-gradient(var(--c-slate-100) 1px, transparent 1px), linear-gradient(90deg, var(--c-slate-100) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        .map-unit {
            position: absolute;
            background: #fff;
            border: 1px solid var(--c-slate-200);
            border-radius: 9px;
            padding: 6px 10px;
            font-size: 11px;
            cursor: pointer;
            transition: .15s;
            white-space: nowrap;
        }

        .map-unit:hover {
            transform: scale(1.06);
            box-shadow: var(--shadow-md);
            border-color: var(--c-gold);
            z-index: 2
        }

        .map-unit.cat-fashion {
            background: #FEF3C7;
            border-color: #FBBF24
        }

        .map-unit.cat-food {
            background: #FCE7F3;
            border-color: #F472B6
        }

        .map-unit.cat-service {
            background: #DBEAFE;
            border-color: #60A5FA
        }

        .empty {
            padding: 46px 22px;
            text-align: center;
            color: var(--c-slate-500);
            border-radius: 14px;
            background: #fff;
            border: 1px dashed var(--c-slate-200);
        }

        .empty-icon {
            font-size: 46px;
            margin-bottom: 12px;
            opacity: .55
        }

        .empty h3 {
            color: var(--c-slate-700);
            margin-bottom: 6px
        }

        /* Finance */
        .finance-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 18px
        }

        .finance-summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 18px
        }

        .finance-source-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(290px, 100%), 1fr));
            gap: 14px
        }

        .finance-source-card {
            background: #fff;
            border: 1px solid var(--c-slate-100);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
            transition: .18s;
            min-width: 0;
        }

        .finance-source-card:hover {
            border-color: var(--c-gold-400);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px)
        }

        .finance-source-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px
        }

        .finance-source-icon {
            width: 44px;
            height: 44px;

            font-size: 12px;
            line-height: 1.9;
            color: var(--c-slate-700);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px
        }

            grid-column: 1/-1
        }

        }

        /* ---------- 19. RENDER APP ---------- */
        function renderApp() {
            const app = document.getElementById("app");
            const parts = getRouteParts();
            Store.sidebarOpen = false;

            if (["portal", "admin", "executive"].includes(parts[0]) && !Store.currentUser) {
                navigate("auth/login");
                return;
            }
            if (parts[0] === "auth" && Store.currentUser) {
                goDashboard();
                return;
            }
            if (parts[0] !== "auth" && countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }

            let html = "";
            if (parts[0] === "public" || !parts[0]) {
                const page = parts[1] || "home";
                const map = {
                    home: PublicHome, about: PublicAbout, stores: PublicStores, food: PublicFood,
                    events: PublicEvents, news: PublicNews, offers: PublicOffers, visitor: PublicVisitor, contact: PublicContact
                };
                html = PublicHeader() + (page === "store" ? PublicStoreDetail(parts[2]) : (map[page] || PublicHome)()) + PublicFooter();
            }
            else if (parts[0] === "auth") {
                html = AuthLogin();
            }
            else if (parts[0] === "portal") {
                const page = parts[1] || "dashboard";
                let content = "", title = "";
                if (page === "dashboard") { content = OwnerDashboard(); title = "داشبورد"; }
                else if (page === "properties") { content = OwnerProperties(); title = "املاک من"; }
                else if (page === "finance") { content = OwnerFinance(); title = "امور مالی"; }
                else if (page === "invoices") { content = OwnerInvoices(); title = "صورتحساب‌ها"; }
                else if (page === "invoice") { content = OwnerInvoiceDetail(parts[2]); title = "جزئیات صورتحساب"; }
                else if (page === "payment") { content = OwnerPayment(parts[2]); title = "پرداخت"; }
                else if (page === "documents") { content = OwnerDocuments(); title = "اسناد"; }
                else if (page === "bylaws") { content = OwnerBylaws(); title = "اساسنامه"; }
                else if (page === "meetings") { content = OwnerMeetings(); title = "جلسات"; }
                else if (page === "voting") { content = OwnerVoting(); title = "رأی‌گیری"; }
                else if (page === "notifications") { content = OwnerNotifications(); title = "اعلان‌ها"; }
                else if (page === "messages") { content = OwnerMessages(); title = "پیام‌ها"; }
                else if (page === "requests") { content = OwnerRequests(); title = "درخواست‌ها"; }
                else if (page === "surveys") { content = OwnerSurveys(); title = "نظرسنجی"; }
                else if (page === "calendar") { content = OwnerCalendar(); title = "تقویم"; }
                else if (page === "profile") { content = OwnerProfile(); title = "پروفایل"; }
                else { content = OwnerDashboard(); title = "داشبورد"; }
                html = PortalShell(content, "owner", title);
            }
            else if (parts[0] === "executive") {
                const page = parts[1] || "dashboard";
                let content = "", title = "";
                if (page === "dashboard") { content = ExecutiveDashboard(); title = "داشبورد فرماندهی"; }
                else if (page === "financial") { content = FinancialModel(); title = "مدل مالی مجتمع"; }
                else if (page === "resolutions") { content = AdminResolutions(); title = "مصوبات"; }
                else if (page === "projects") { content = AdminProjects(); title = "پروژه‌ها"; }
                else if (page === "meetings") { content = OwnerMeetings(); title = "جلسات"; }
                else { content = ExecutiveDashboard(); title = "داشبورد فرماندهی"; }
                html = PortalShell(content, "board", title);
            }
            else if (parts[0] === "admin") {
                const page = parts[1] || "dashboard";
                let content = "", title = "";
                if (page === "dashboard") { content = AdminDashboard(); title = "داشبورد مدیریتی"; }
                else if (page === "finance") { content = FinancialModel(); title = "مدل مالی مجتمع"; }
                else if (page === "owners") { content = AdminOwners(); title = "مدیریت مالکین"; }
                else if (page === "properties") { content = AdminProperties(); title = "واحدها"; }
                else if (page === "documents") { content = OwnerDocuments(); title = "اسناد"; }
                else if (page === "meetings") { content = OwnerMeetings(); title = "جلسات"; }
                else if (page === "resolutions") { content = AdminResolutions(); title = "مصوبات"; }
                else if (page === "voting") { content = OwnerVoting(); title = "رأی‌گیری"; }
                else if (page === "tickets") { content = OwnerRequests(); title = "درخواست‌ها"; }
                else if (page === "notifications") { content = OwnerNotifications(); title = "اعلان‌ها"; }
                else if (page === "cms") { content = AdminCms(); title = "مدیریت محتوا"; }
                else if (page === "media") { content = AdminMedia(); title = "کتابخانه رسانه"; }
                else if (page === "roles") { content = AdminRoles(); title = "نقش‌ها"; }
                else if (page === "audit") { content = AdminAudit(); title = "Audit Log"; }
                else if (page === "settings") { content = AdminSettings(); title = "تنظیمات"; }
                else { content = AdminDashboard(); title = "داشبورد مدیریتی"; }
                html = PortalShell(content, Store.currentUser.role, title);
            }
            else {
                html = PublicHeader() + PublicHome() + PublicFooter();
            }

            html += `<div class="demo-badge">🎯 نسخه Demo برای هیئت‌مدیره</div>` + DemoControlCenter();
            app.innerHTML = html;
            window.scrollTo({ top: 0, behavior: "auto" });

            const mobileToggle = document.getElementById("mobileSidebarToggle");
            if (mobileToggle) {
                mobileToggle.style.display = window.innerWidth <= 1024 ? "inline-flex" : "none";
            }
            requestAnimationFrame(() => setTimeout(initCharts, 50));
        }

        /* ---------- 20. FINANCE ACTIONS ---------- */
        function refreshFinancialView() {
            const host = document.getElementById("financeWorkspace");
            if (!host) return;
            buildRevenueBreakdown();
            host.innerHTML = financeTabState.tab === "sources" ? financeManagementView() : financeOverviewView();
            requestAnimationFrame(() => setTimeout(initCharts, 30));
        }
        function csvCell(v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }
        function exportFinanceCsv() {
            const rows = [
                ["نام منبع درآمد", "نوع", "مخاطب/محل", "مبنای محاسبه", "فرمول", "قرارداد/مصوبه", "برآورد ماهانه (میلیون ریال)", "وضعیت", "توضیحات"],
                ...MOCK.fin.revenueStreams.map(s => [s.name, s.type, s.target, s.basis, s.formula, s.contract, s.monthly, s.active ? "فعال" : "غیرفعال", s.description || ""])
            ];
            const csv = "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "mahestan-finance-revenue-sources.csv";
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            addToast("خروجی مالی با موفقیت تولید شد");
        }

        /* ---------- 21. EVENTS ---------- */
        document.addEventListener("click", async (e) => {
            const t = e.target.closest("[data-action]");
            if (!t) return;
            const a = t.dataset.action;

            if (a === "navigate") { e.preventDefault(); navigate(t.dataset.route); }
            else if (a === "logout") { logout(); }
            else if (a === "demo-toast") { addToast(t.dataset.msg || "این قابلیت در نسخه Demo است.", "info"); }
            else if (a === "map-floor") { Store.mapFloor = t.dataset.floor; renderApp(); }
            else if (a === "store-cat") { Store.storeFilter.cat = t.dataset.cat; refreshStores(false); }
            else if (a === "store-floor") { Store.storeFilter.floor = t.dataset.floor; refreshStores(false); }
            else if (a === "quick-login") { const u = MOCK.users.find(x => x.id === t.dataset.uid); if (u) login(u); }
            else if (a === "auth-back") { Store.authStep = 1; renderApp(); }
            else if (a === "resend-otp") { Store.authCountdown = 120; addToast("کد مجدداً ارسال شد"); renderApp(); startCountdown(); }
            else if (a === "toggle-public-menu") {
                Store.publicMenuOpen = !Store.publicMenuOpen;
                const links = document.getElementById("publicNavLinks");
                if (links) links.classList.toggle("open", Store.publicMenuOpen);
                t.setAttribute("aria-expanded", String(Store.publicMenuOpen));
            }
            else if (a === "toggle-sidebar") {
                Store.sidebarOpen = !Store.sidebarOpen;
                const sidebar = document.getElementById("mainSidebar");
                const backdrop = document.querySelector(".sidebar-backdrop");
                if (sidebar) sidebar.classList.toggle("open", Store.sidebarOpen);
                if (backdrop) backdrop.classList.toggle("open", Store.sidebarOpen);
                t.setAttribute("aria-expanded", String(Store.sidebarOpen));
                document.body.style.overflow = Store.sidebarOpen ? "hidden" : "";
            }
            else if (a === "close-sidebar") {
                Store.sidebarOpen = false;
                const sidebar = document.getElementById("mainSidebar");
                const backdrop = document.querySelector(".sidebar-backdrop");
                if (sidebar) sidebar.classList.remove("open");
                if (backdrop) backdrop.classList.remove("open");
                document.body.style.overflow = "";
            }
            else if (a === "collapse-sidebar") {
                Store.sidebarCollapsed = !Store.sidebarCollapsed;
                storage.set("mahestan_sidebar_collapsed", Store.sidebarCollapsed);
                const layout = document.querySelector(".portal-layout");
                if (layout) layout.classList.toggle("sidebar-collapsed", Store.sidebarCollapsed);
                const btnCollapse = document.querySelector('[data-action="collapse-sidebar"]');
                if (btnCollapse) btnCollapse.innerHTML = Store.sidebarCollapsed ? "→" : "←";
            }
            else if (a === "pay-invoice") {
                Store.currentInvoiceId = t.dataset.id;
                Store.paymentResult = null;
                navigate("portal/payment/" + t.dataset.id);
            }
            else if (a === "pay-start") {
                const id = t.dataset.id || Store.currentInvoiceId || getRouteInvoiceId();
                Store.currentInvoiceId = id;
                Store.paymentResult = { loading: true };
                renderApp();
                await new Promise(r => setTimeout(r, 1400));
                const ok = Math.random() > 0.15;
                if (ok) {
                    const inv = MOCK.invoices.find(i => i.id === id);
                    if (inv) inv.status = "پرداخت شده";
                    Store.paymentResult = { ok: true, trackingCode: "PC-" + Math.floor(Math.random() * 900000 + 100000) };
                    addToast("پرداخت موفقیت‌آمیز");
                } else {
                    Store.paymentResult = { ok: false, error: "خطا در ارتباط با درگاه بانکی" };
                }
                renderApp();
            }
            else if (a === "pay-scenario") {
                const s = t.dataset.s;
                const id = Store.currentInvoiceId || getRouteInvoiceId();
                Store.paymentResult = { loading: true };
                renderApp();
                await new Promise(r => setTimeout(r, 1100));
                if (s === "cancel") { addToast("پرداخت لغو شد", "info"); Store.paymentResult = null; }
                else if (s === "fail") { Store.paymentResult = { ok: false, error: "خطا در ارتباط با درگاه بانکی" }; }
                else {
                    const inv = MOCK.invoices.find(i => i.id === id);
                    if (inv) inv.status = "پرداخت شده";
                    Store.paymentResult = { ok: true, trackingCode: "PC-" + Math.floor(Math.random() * 900000 + 100000) };
                    addToast("پرداخت موفقیت‌آمیز");
                }
                renderApp();
            }
            else if (a === "vote") {
                const p = MOCK.polls.find(x => x.id === t.dataset.poll);
                if (!p || p.status !== "active") return;
                const votes = Store.userVotes || {};
                const old = votes[p.id];
                if (old === t.dataset.opt) { addToast("شما قبلاً این گزینه را انتخاب کرده‌اید", "info"); return; }
                if (old) {
                    const oldOpt = p.options.find(o => o.id === old);
                    if (oldOpt && oldOpt.votes > 0) oldOpt.votes--;
                }
                const newOpt = p.options.find(o => o.id === t.dataset.opt);
                if (newOpt) newOpt.votes++;
                votes[p.id] = t.dataset.opt;
                Store.userVotes = votes;
                saveUserVotes();
                addToast("رأی شما ثبت شد");
                renderApp();
            }
            else if (a === "toggle-notif-panel") { Store.notifPanelOpen = !Store.notifPanelOpen; renderApp(); }
            else if (a === "close-notif-panel") { Store.notifPanelOpen = false; renderApp(); }
            else if (a === "mark-all-read") { Store.notificationsRead = true; Store.notifPanelOpen = false; addToast("همه اعلان‌ها خوانده شدند"); renderApp(); }
            else if (a === "notif-filter") { Store.notifFilter = t.dataset.cat; renderApp(); }
            else if (a === "open-ticket-modal") { Store.showModal = true; renderApp(); }
            else if (a === "close-ticket-modal") { Store.showModal = false; renderApp(); }
            else if (a === "submit-ticket") { Store.showModal = false; addToast("درخواست ثبت شد"); renderApp(); }
            else if (a === "open-ticket-detail") { Store.ticketModalId = t.dataset.id; renderApp(); }
            else if (a === "close-ticket-detail") { Store.ticketModalId = null; renderApp(); }
            else if (a === "dcc-toggle") { Store.dccOpen = !Store.dccOpen; renderApp(); }
            else if (a === "dcc-switch" || a === "dcc-scenario") {
                resetDemoFinance();
                const u = a === "dcc-switch"
                    ? MOCK.users.find(x => x.id === t.dataset.uid)
                    : MOCK.users[{ debtor: 0, clean: 1, manager: 3, board: 4, finance: 5, admin: 6 }[t.dataset.s]];
                if (u) { login(u); addToast("ورود به عنوان: " + u.name + " (" + roleLabel(u.role) + ")"); }
            }
            /* Finance actions */
            else if (a === "finance-tab") { financeTabState.tab = t.dataset.tab || "overview"; financeTabState.editId = null; refreshFinancialView(); }
            else if (a === "finance-add") { financeTabState.tab = "sources"; financeTabState.editId = "__new__"; refreshFinancialView(); }
            else if (a === "finance-edit") { financeTabState.tab = "sources"; financeTabState.editId = t.dataset.id; refreshFinancialView(); }
            else if (a === "finance-close-form") { financeTabState.editId = null; refreshFinancialView(); }
            else if (a === "finance-toggle") {
                const s = financeStreamById(t.dataset.id);
                if (!s) return;
                s.active = !s.active;
                buildRevenueBreakdown();
                persistFinance();
                addToast(`منبع «${s.name}» ${s.active ? "فعال" : "غیرفعال"} شد`);
                refreshFinancialView();
            }
            else if (a === "finance-delete") {
                const s = financeStreamById(t.dataset.id);
                if (!s) return;
                if (confirm(`منبع «${s.name}» حذف شود؟`)) {
                    MOCK.fin.revenueStreams = MOCK.fin.revenueStreams.filter(x => x.id !== s.id);
                    buildRevenueBreakdown();
                    persistFinance();
                    addToast("منبع درآمد حذف شد", "info");
                    refreshFinancialView();
                }
            }
            else if (a === "finance-export") { exportFinanceCsv(); }
        });

        document.addEventListener("input", (e) => {
            const t = e.target;
            if (t.dataset.actionInput === "auth-mobile") {
                Store.authMobile = t.value.replace(/[^\d]/g, "").slice(0, 11);
            }
            else if (t.dataset.actionInput === "store-q") {
                Store.storeFilter.q = t.value.trim();
                refreshStores(true);
            }
            else if (t.classList.contains("otp-box")) {
                const idx = parseInt(t.dataset.otpIdx, 10);
                const v = t.value.replace(/[^\d]/g, "").slice(-1);
                t.value = v;
                Store.authCode[idx] = v;
                if (v && idx < 3) {
                    const nx = document.querySelector('.otp-box[data-otp-idx="' + (idx + 1) + '"]');
                    if (nx) nx.focus();
                }
            }
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                if (Store.showModal) { Store.showModal = false; renderApp(); return; }
                if (Store.ticketModalId) { Store.ticketModalId = null; renderApp(); return; }
                if (financeTabState.editId) { financeTabState.editId = null; refreshFinancialView(); return; }
                if (Store.notifPanelOpen) { Store.notifPanelOpen = false; renderApp(); return; }
                if (Store.sidebarOpen) {
                    Store.sidebarOpen = false;
                    const sidebar = document.getElementById("mainSidebar");
                    const backdrop = document.querySelector(".sidebar-backdrop");
                    if (sidebar) sidebar.classList.remove("open");
                    if (backdrop) backdrop.classList.remove("open");
                    document.body.style.overflow = "";
                    return;
                }
                if (Store.publicMenuOpen) {
                    Store.publicMenuOpen = false;
                    const links = document.getElementById("publicNavLinks");
                    if (links) links.classList.remove("open");
                    return;
                }
            }
            const t = e.target;
            if (t.classList && t.classList.contains("otp-box") && e.key === "Backspace" && !t.value) {
                const idx = parseInt(t.dataset.otpIdx, 10);
                if (idx > 0) {
                    const pv = document.querySelector('.otp-box[data-otp-idx="' + (idx - 1) + '"]');
                    if (pv) pv.focus();
                }
            }
        });

        document.addEventListener("submit", async (e) => {
            const f = e.target.closest("[data-action-form]");
            if (!f) return;
            e.preventDefault();
            const a = f.dataset.actionForm;

            if (a === "send-otp") {
                if (!/^09\d{9}$/.test(Store.authMobile)) {
                    addToast("شماره موبایل معتبر نیست", "error");
                    return;
                }
                Store.authStep = 2;
                Store.authCountdown = 120;
                Store.authCode = ["", "", "", ""];
                addToast("کد تأیید ارسال شد");
                renderApp();
                startCountdown();
                setTimeout(() => {
                    const b = document.querySelector('.otp-box[data-otp-idx="0"]');
                    if (b) b.focus();
                }, 60);
            }
            else if (a === "verify-otp") {
                const code = Store.authCode.join("");
                if (code.length !== 4) {
                    addToast("کد ۴ رقمی را کامل وارد کنید", "error");
                    return;
                }
                const user = MOCK.users.find(u => u.mobile === Store.authMobile);
                if (code === CONFIG.otpDemoCode && user) {
                    login(user);
                } else {
                    addToast("کد اشتباه است", "error");
                }
            }
            else if (a === "finance-save") {
                const fd = new FormData(f);
                const name = String(fd.get("name") || "").trim();
                const target = String(fd.get("target") || "").trim();
                const monthlyRaw = fd.get("monthly");
                const monthly = Math.max(0, Number(monthlyRaw || 0));
                if (!name || !target || Number.isNaN(monthly)) {
                    addToast("اطلاعات منبع درآمد کامل نیست", "error");
                    return;
                }
                const payload = {
                    name,
                    type: String(fd.get("type") || "سایر"),
                    target,
                    basis: String(fd.get("basis") || "ثابت ماهانه"),
                    formula: String(fd.get("formula") || "").trim(),
                    contract: String(fd.get("contract") || "").trim(),
                    monthly,
                    active: String(fd.get("active")) !== "0",
                    description: String(fd.get("description") || "").trim()
                };
                const editId = String(fd.get("id") || "");
                if (editId) {
                    const s = financeStreamById(editId);
                    if (s) Object.assign(s, payload);
                    addToast("منبع درآمد به‌روزرسانی شد");
                } else {
                    payload.id = "rs-" + Date.now().toString(36);
                    MOCK.fin.revenueStreams.push(payload);
                    addToast("منبع درآمد جدید ثبت شد");
                }
                buildRevenueBreakdown();
                persistFinance();
                financeTabState.editId = null;
                financeTabState.tab = "sources";
                refreshFinancialView();
            }
            else if (a === "contact") {
                addToast("پیام شما با موفقیت ارسال شد (Demo).");
                f.reset();
            }
        });

        window.addEventListener("resize", debounce(() => {
            const mobileToggle = document.getElementById("mobileSidebarToggle");
            if (mobileToggle) {
                mobileToggle.style.display = window.innerWidth <= 1024 ? "inline-flex" : "none";
            }
            if (window.innerWidth > 1024 && Store.sidebarOpen) {
                Store.sidebarOpen = false;
                const sidebar = document.getElementById("mainSidebar");
                const backdrop = document.querySelector(".sidebar-backdrop");
                if (sidebar) sidebar.classList.remove("open");
                if (backdrop) backdrop.classList.remove("open");
                document.body.style.overflow = "";
            }
        }, 180));

        window.addEventListener("hashchange", renderApp);

        /* ---------- 22. COUNTDOWN ---------- */
        let countdownInterval = null;
        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                if (Store.authCountdown <= 0) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    renderApp();
                    return;
                }
                Store.authCountdown--;
                const el = document.querySelector('[data-action="resend-otp"]');
                if (el && el.parentElement) {
                    if (Store.authCountdown > 0) {
                        el.parentElement.innerHTML = '<span class="muted">ارسال مجدد تا ' + Math.floor(Store.authCountdown / 60) + ':' + String(Store.authCountdown % 60).padStart(2, "0") + ' دیگر</span>';
                    } else {
                        el.parentElement.innerHTML = '<button type="button" data-action="resend-otp" style="color:var(--c-gold-600);font-weight:700">ارسال مجدد کد</button>';
                    }
                }
            }, 1000);
        }

        /* ---------- 23. INIT ---------- */
        (function init() {
            const savedState = storage.get("mahestan_demo_v3", null);
            MOCK.fin.revenueStreams = Array.isArray(savedState && savedState.revenueStreams) && savedState.revenueStreams.length
                ? savedState.revenueStreams
                : defaultRevenueStreams.slice();
            buildRevenueBreakdown();
            persistFinance();

            const sessionUser = storage.sessionGet("mahestan_session", null);
            if (sessionUser && MOCK.users.some(u => u.id === sessionUser.id)) {
                Store.currentUser = sessionUser;
                Store.userVotes = loadUserVotes(sessionUser.id);
            }

            if (!window.location.hash) {
                window.location.hash = "#/public/home";
            }
            renderApp();
        })();
    </script>
</body>

</html>
