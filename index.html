<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مجتمع تجاری مهستان کرج | پلتفرم دیجیتال</title>
  <meta name="description" content="پلتفرم یکپارچه مجتمع تجاری مهستان کرج" />

  <!--
  ═══════════════════════════════════════════════════════
  راهنمای تصاویر واقعی:
  پوشه images کنار همین فایل بسازید و ۴ عکس را با نام‌های
  mahestan-1.jpg تا mahestan-4.jpg کپی کنید.
  در نبود عکس‌ها، Placeholder هوشمند نمایش داده می‌شود.
  ═══════════════════════════════════════════════════════

  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"
    type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    /* =========================================================
   MAHESTAN DESIGN SYSTEM - Premium Persian Commercial RE
   ========================================================= */
    :root {
      --c-navy-900: #0A1828;
      --c-navy-800: #0F1F38;
      --c-navy-700: #152A47;
      --c-charcoal: #1E293B;
      --c-slate-700: #334155;
      --c-slate-500: #64748B;
      --c-slate-400: #94A3B8;
      --c-slate-200: #E2E8F0;
      --c-slate-100: #F1F5F9;
      --c-ivory: #FAF9F6;
      --c-white: #FFFFFF;
      --c-gold: #C9A96E;
      --c-gold-600: #B8925A;
      --c-gold-400: #E2C994;
      --c-gold-100: #F7F0E2;
      --c-success: #0F8F6A;
      --c-success-50: #E6F5EF;
      --c-warning: #D97706;
      --c-warning-50: #FEF3C7;
      --c-error: #C8323A;
      --c-error-50: #FEE2E2;
      --c-info: #2563EB;
      --c-info-50: #DBEAFE;
      --font-sans: 'Vazirmatn', 'Segoe UI', 'Tahoma', system-ui, sans-serif;
      --r-sm: 6px;
      --r-md: 10px;
      --r-lg: 16px;
      --r-xl: 24px;
      --shadow-sm: 0 1px 2px rgba(15, 24, 40, .06);
      --shadow-md: 0 4px 12px rgba(15, 24, 40, .08);
      --shadow-lg: 0 12px 32px rgba(15, 24, 40, .12);
      --shadow-xl: 0 24px 48px rgba(15, 24, 40, .18);
      --sidebar-w: 260px;
      --header-h: 68px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      font-family: var(--font-sans);
      background: var(--c-ivory);
      color: var(--c-navy-900);
      line-height: 1.65;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    input,
    select,
    textarea {
      font-family: inherit;
      font-size: 14px;
    }

    ul {
      list-style: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .flex {
      display: flex;
    }

    .grid {
      display: grid;
    }

    .items-center {
      align-items: center;
    }

    .justify-between {
      justify-content: space-between;
    }

    .w-full {
      width: 100%;
    }

    .text-center {
      text-align: center;
    }

    .muted {
      color: var(--c-slate-500);
      font-size: 13px;
    }

    .small {
      font-size: 12px;
    }

    .h1 {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .h2 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .h3 {
      font-size: 20px;
      font-weight: 600;
    }

    .h4 {
      font-size: 16px;
      font-weight: 600;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-gold {
      background: var(--c-gold-100);
      color: var(--c-gold-600);
    }

    .badge-success {
      background: var(--c-success-50);
      color: var(--c-success);
    }

    .badge-warning {
      background: var(--c-warning-50);
      color: var(--c-warning);
    }

    .badge-error {
      background: var(--c-error-50);
      color: var(--c-error);
    }

    .badge-info {
      background: var(--c-info-50);
      color: var(--c-info);
    }

    .badge-slate {
      background: var(--c-slate-100);
      color: var(--c-slate-700);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--r-md);
      font-weight: 600;
      font-size: 14px;
      transition: all .18s ease;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--c-navy-800);
      color: #fff;
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--c-gold), var(--c-gold-600));
      color: #fff;
    }

    .btn-gold:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(201, 169, 110, .35);
    }

    .btn-ghost {
      background: transparent;
      color: var(--c-navy-800);
      border: 1px solid var(--c-slate-200);
    }

    .btn-ghost:hover {
      background: var(--c-slate-100);
    }

    .btn-success {
      background: var(--c-success);
      color: #fff;
    }

    .btn-outline {
      border: 1px solid var(--c-navy-800);
      color: var(--c-navy-800);
      background: transparent;
    }

    .btn-outline:hover {
      background: var(--c-navy-800);
      color: #fff;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn-lg {
      padding: 14px 28px;
      font-size: 16px;
    }

    .btn-block {
      width: 100%;
      justify-content: center;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--c-slate-200);
      border-radius: var(--r-md);
      background: #fff;
      transition: border .15s, box-shadow .15s;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      outline: none;
      border-color: var(--c-gold);
      box-shadow: 0 0 0 3px var(--c-gold-100);
    }

    .label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--c-slate-700);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .card {
      background: #fff;
      border-radius: var(--r-lg);
      padding: 24px;
      border: 1px solid var(--c-slate-100);
      box-shadow: var(--shadow-sm);
    }

    .card-hover {
      transition: all .2s;
      cursor: pointer;
    }

    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--c-gold-400);
    }

    .card-title {
      font-size: 14px;
      color: var(--c-slate-500);
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--c-navy-900);
    }

    /*  FIX: wrapper با ارتفاع ثابت برای نمودارها (جلوگیری از رشد بی‌نهایت) */
    .chart-box {
      position: relative;
      height: 280px;
      width: 100%;
    }

    /*  تصاویر واقعی با fallback هوشمند */
    .photo {
      position: relative;
      border-radius: var(--r-lg);
      overflow: hidden;
      height: 240px;
      background: linear-gradient(135deg, var(--c-slate-100), var(--c-slate-200));
    }

    .photo::before {
      content: "تصویر واقعی مجتمع مهستان — برای نمایش، پوشه images را کنار فایل کپی کنید";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--c-slate-500);
      font-size: 12px;
      padding: 16px;
      text-align: center;
    }

    .photo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo img.img-missing {
      display: none;
    }

    .photo figcaption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 26px 14px 10px;
      background: linear-gradient(transparent, rgba(10, 24, 40, .85));
      color: #fff;
      font-size: 12px;
      z-index: 2;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, .4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      display: inline-block;
    }

    .spinner.dark {
      border-color: var(--c-slate-200);
      border-top-color: var(--c-gold);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .public-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, .95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--c-slate-100);
    }

    .public-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--header-h);
      padding: 0 32px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      color: var(--c-navy-900);
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--c-navy-800), var(--c-charcoal));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--c-gold);
      font-weight: 700;
      font-size: 18px;
      box-shadow: var(--shadow-sm);
    }

    .nav-links {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .nav-links a {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      color: var(--c-slate-700);
      font-weight: 500;
      transition: all .15s;
      cursor: pointer;
    }

    .nav-links a:hover {
      background: var(--c-slate-100);
      color: var(--c-navy-900);
    }

    .nav-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* 🖼️ HERO با عکس واقعی نمای شب مهستان */
    .hero {
      position: relative;
      min-height: 88vh;
      display: flex;
      align-items: center;
      overflow: hidden;
      color: #fff;
      background-color: var(--c-navy-900);
      background-image: linear-gradient(135deg, rgba(10, 24, 40, .92), rgba(10, 24, 40, .55) 55%, rgba(10, 24, 40, .78)), url('images/mahestan-1.jpg');
      background-size: cover;
      background-position: center bottom;
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      max-width: 780px;
      padding: 0 64px;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(201, 169, 110, .15);
      border: 1px solid rgba(201, 169, 110, .3);
      border-radius: 999px;
      color: var(--c-gold-400);
      font-size: 13px;
      margin-bottom: 24px;
    }

    .hero h1 {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }

    .hero h1 span {
      background: linear-gradient(135deg, var(--c-gold-400), var(--c-gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      font-size: 18px;
      color: rgba(255, 255, 255, .78);
      margin-bottom: 36px;
      max-width: 560px;
    }

    .hero-ctas {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .hero-stats {
      position: absolute;
      bottom: 48px;
      left: 64px;
      right: 64px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      z-index: 2;
    }

    .hero-stat {
      padding: 16px 20px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 12px;
      backdrop-filter: blur(12px);
    }

    .hero-stat-num {
      font-size: 28px;
      font-weight: 700;
      color: var(--c-gold-400);
    }

    .hero-stat-lbl {
      font-size: 12px;
      color: rgba(255, 255, 255, .7);
      margin-top: 4px;
    }

    .demo-badge {
      position: fixed;
      bottom: 24px;
      left: 24px;
      background: var(--c-gold);
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      z-index: 999;
      box-shadow: var(--shadow-lg);
    }

    .section {
      padding: 80px 0;
    }

    .section-title {
      text-align: center;
      margin-bottom: 48px;
    }

    .section-title .kicker {
      color: var(--c-gold-600);
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 8px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .section-title h2 {
      font-size: 34px;
      font-weight: 700;
      color: var(--c-navy-900);
    }

    .stores-filter {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 32px;
    }

    .chip {
      padding: 8px 16px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--c-slate-200);
      font-size: 13px;
      color: var(--c-slate-700);
      cursor: pointer;
      transition: all .15s;
      font-weight: 500;
    }

    .chip:hover {
      border-color: var(--c-gold);
    }

    .chip.active {
      background: var(--c-navy-800);
      color: #fff;
      border-color: var(--c-navy-800);
    }

    .stores-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .store-card {
      background: #fff;
      border-radius: var(--r-lg);
      overflow: hidden;
      border: 1px solid var(--c-slate-100);
      transition: all .22s;
      cursor: pointer;
    }

    .store-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: var(--c-gold-400);
    }

    .store-thumb {
      height: 160px;
      background: linear-gradient(135deg, var(--c-slate-100), var(--c-slate-200));
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .store-thumb::after {
      content: "تصویر نمونه Demo";
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, .6);
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
    }

    .store-logo {
      position: absolute;
      top: -24px;
      right: 16px;
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      color: var(--c-navy-800);
      box-shadow: var(--shadow-md);
      border: 2px solid #fff;
    }

    .store-body {
      padding: 20px;
      padding-top: 36px;
    }

    .store-name {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .store-cat {
      color: var(--c-slate-500);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .store-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--c-slate-500);
      border-top: 1px solid var(--c-slate-100);
      padding-top: 12px;
      margin-top: 8px;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .kpi {
      background: #fff;
      padding: 28px;
      border-radius: var(--r-lg);
      border: 1px solid var(--c-slate-100);
      text-align: center;
    }

    .kpi-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--c-gold-100), var(--c-gold-400));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 24px;
      color: var(--c-gold-600);
    }

    .kpi-num {
      font-size: 28px;
      font-weight: 700;
      color: var(--c-navy-900);
    }

    .kpi-lbl {
      color: var(--c-slate-500);
      font-size: 13px;
      margin-top: 4px;
    }

    .footer {
      background: var(--c-navy-900);
      color: rgba(255, 255, 255, .7);
      padding: 56px 0 24px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 40px;
      margin-bottom: 32px;
    }

    .footer h4 {
      color: #fff;
      font-size: 15px;
      margin-bottom: 16px;
    }

    .footer a {
      display: block;
      padding: 4px 0;
      color: rgba(255, 255, 255, .65);
      font-size: 13px;
      cursor: pointer;
    }

    .footer a:hover {
      color: var(--c-gold-400);
    }

    .footer-bottom {
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, .1);
      font-size: 12px;
      text-align: center;
    }

    .auth-wrap {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .auth-visual {
      background-color: var(--c-navy-900);
      background-image: linear-gradient(160deg, rgba(10, 24, 40, .94), rgba(15, 31, 56, .88)), url('images/mahestan-2.jpg');
      background-size: cover;
      background-position: center;
      color: #fff;
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .auth-visual-content {
      position: relative;
      z-index: 2;
      max-width: 420px;
    }

    .auth-visual h2 {
      font-size: 32px;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .auth-visual p {
      color: rgba(255, 255, 255, .75);
      font-size: 15px;
    }

    .auth-features {
      margin-top: 32px;
      display: grid;
      gap: 14px;
    }

    .auth-feature {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .auth-feature-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(201, 169, 110, .15);
      color: var(--c-gold-400);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .auth-form-wrap {
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #fff;
    }

    .auth-form {
      max-width: 400px;
      margin: 0 auto;
      width: 100%;
    }

    .auth-form h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .auth-form .sub {
      color: var(--c-slate-500);
      margin-bottom: 32px;
    }

    .otp-boxes {
      display: flex;
      gap: 10px;
      direction: ltr;
      justify-content: center;
      margin: 24px 0;
    }

    .otp-box {
      width: 52px;
      height: 58px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      border: 2px solid var(--c-slate-200);
      border-radius: 10px;
      background: #fff;
    }

    .otp-box:focus {
      border-color: var(--c-gold);
      outline: none;
      box-shadow: 0 0 0 3px var(--c-gold-100);
    }

    .demo-hint {
      background: var(--c-gold-100);
      color: var(--c-gold-600);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      margin-top: 16px;
      border: 1px dashed var(--c-gold-400);
    }

    .portal-layout {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;

    /* ---------- 13. RENDER ---------- */

      Store.charts = {};

      if ((parts[0] === "portal" || parts[0] === "admin" || parts[0] === "executive") && !Store.currentUser) { navigate("auth/login"); return; }
      if (parts[0] === "auth" && Store.currentUser) { goDashboard(); return; }
      if (parts[0] !== "auth" && countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }

      let html = "";

    /* ---------- 14. EVENTS ---------- */
    document.addEventListener("click", async (e) => {
      const t = e.target.closest("[data-action]");
      if (!t) return;
      const a = t.dataset.action;

      if (a === "navigate") { e.preventDefault(); navigate(t.dataset.route); }
      else if (a === "logout") { logout(); }
      else if (a === "map-floor") { Store.mapFloor = t.dataset.floor; renderApp(); }
      else if (a === "store-cat") { Store.storeFilter.cat = t.dataset.cat; refreshStores(false); }
      else if (a === "store-floor") { Store.storeFilter.floor = t.dataset.floor; refreshStores(false); }
      else if (a === "quick-login") { const u = MOCK.users.find(x => x.id === t.dataset.uid); if (u) login(u); }
      else if (a === "auth-back") { Store.authStep = 1; renderApp(); }
      else if (a === "resend-otp") { Store.authCountdown = 120; addToast("کد مجدداً ارسال شد"); renderApp(); startCountdown(); }
      else if (a === "pay-invoice") { Store.currentInvoiceId = t.dataset.id; Store.paymentResult = null; navigate("portal/payment/" + t.dataset.id); }
      else if (a === "pay-start") {
        Store.paymentResult = { loading: true }; renderApp();
        await new Promise(r => setTimeout(r, 1500));
        const ok = Math.random() > 0.15;
        if (ok) {
          const inv = MOCK.invoices.find(i => i.id === Store.currentInvoiceId); if (inv) inv.status = "پرداخت شده";
          Store.paymentResult = { ok: true, trackingCode: "PC-" + Math.floor(Math.random() * 900000 + 100000) }; addToast("پرداخت موفقیت‌آمیز");
        }
        else Store.paymentResult = { ok: false, error: "خطا در ارتباط با درگاه بانکی" };
        renderApp();
      }
      else if (a === "pay-scenario") {
        const s = t.dataset.s; Store.paymentResult = { loading: true }; renderApp();
        await new Promise(r => setTimeout(r, 1200));
        if (s === "cancel") { addToast("پرداخت لغو شد", "info"); Store.paymentResult = null; }
        else if (s === "fail") { Store.paymentResult = { ok: false, error: "خطا در ارتباط با درگاه بانکی" }; }
        else {
          const inv = MOCK.invoices.find(i => i.id === Store.currentInvoiceId); if (inv) inv.status = "پرداخت شده";
          Store.paymentResult = { ok: true, trackingCode: "PC-" + Math.floor(Math.random() * 900000 + 100000) }; addToast("پرداخت موفقیت‌آمیز");
        }
        renderApp();
      }
      else if (a === "vote") {
        const p = MOCK.polls.find(x => x.id === t.dataset.poll);
        if (p && p.status === "active") {
          p.options.forEach(o => { if (o.id === t.dataset.opt) { o.votes++; o.voted = true; } else o.voted = false; });
          addToast("رأی شما ثبت شد"); renderApp();
        }
      }
      else if (a === "toggle-notif-panel") { Store.notifPanelOpen = !Store.notifPanelOpen; renderApp(); }
      else if (a === "close-notif-panel") { Store.notifPanelOpen = false; renderApp(); }
      else if (a === "mark-all-read") { addToast("همه اعلان‌ها خوانده شدند"); Store.notifPanelOpen = false; renderApp(); }
      else if (a === "notif-filter") { Store.notifFilter = t.dataset.cat; renderApp(); }
      else if (a === "open-ticket-modal") { Store.showModal = true; renderApp(); }
      else if (a === "close-ticket-modal") { Store.showModal = false; renderApp(); }
      else if (a === "submit-ticket") { Store.showModal = false; addToast("درخواست ثبت شد"); renderApp(); }
      else if (a === "open-ticket-detail") { Store.ticketModalId = t.dataset.id; renderApp(); }
      else if (a === "close-ticket-detail") { Store.ticketModalId = null; renderApp(); }
      else if (a === "dcc-toggle") { Store.dccOpen = !Store.dccOpen; renderApp(); }
      else if (a === "dcc-switch" || a === "dcc-scenario") {
        resetDemoFinance();
        const u = a === "dcc-switch" ? MOCK.users.find(x => x.id === t.dataset.uid)
          : MOCK.users[{ debtor: 0, clean: 1, manager: 3, board: 4, finance: 5, admin: 6 }[t.dataset.s]];
        if (u) { login(u); addToast("ورود به عنوان: " + u.name + " (" + roleLabel(u.role) + ")"); }
      }
      else if (a === "dcc-toast") { addToast(t.dataset.m, "info"); }
    });

    document.addEventListener("input", (e) => {
      const t = e.target;
      if (t.dataset.actionInput === "auth-mobile") Store.authMobile = t.value.replace(/[^\d]/g, "").slice(0, 11);
      else if (t.dataset.actionInput === "store-q") { Store.storeFilter.q = t.value; refreshStores(true); }
      else if (t.classList.contains("otp-box")) {
        const idx = parseInt(t.dataset.otpIdx);
        const v = t.value.replace(/[^\d]/g, "").slice(-1);
        t.value = v; Store.authCode[idx] = v;
        if (v && idx < 3) { const nx = document.querySelector('.otp-box[data-otp-idx="' + (idx + 1) + '"]'); if (nx) nx.focus(); }
      }
    });

    document.addEventListener("keydown", (e) => {
      const t = e.target;
      if (t.classList.contains("otp-box") && e.key === "Backspace" && !t.value) {
        const idx = parseInt(t.dataset.otpIdx);
        if (idx > 0) { const pv = document.querySelector('.otp-box[data-otp-idx="' + (idx - 1) + '"]'); if (pv) pv.focus(); }
      }
    });

    document.addEventListener("submit", async (e) => {
      const f = e.target.closest("[data-action-form]");
      if (!f) return;
      e.preventDefault();
      const a = f.dataset.actionForm;
      if (a === "send-otp") {
        if (!/^09\d{9}$/.test(Store.authMobile)) { addToast("شماره موبایل معتبر نیست", "error"); return; }
        Store.authStep = 2; Store.authCountdown = 120; Store.authCode = ["", "", "", ""];
        addToast("کد تأیید ارسال شد"); renderApp(); startCountdown();
        setTimeout(() => { const b = document.querySelector('.otp-box[data-otp-idx="0"]'); if (b) b.focus(); }, 50);
      } else if (a === "verify-otp") {
        const code = Store.authCode.join("");
        if (code.length !== 4) { addToast("کد ۴ رقمی را کامل وارد کنید", "error"); return; }
        const res = await API.auth.verifyOtp(Store.authMobile, code);
        if (res.ok) login(res.user); else addToast(res.error, "error");
      }
    });

    let countdownInterval = null;
    function startCountdown() {
      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        if (Store.authCountdown <= 0) { clearInterval(countdownInterval); countdownInterval = null; return; }
        Store.authCountdown--;
        const el = document.querySelector('[data-action="resend-otp"]');
        if (el && el.parentElement) {
          if (Store.authCountdown > 0)
            el.parentElement.innerHTML = '<span class="muted">ارسال مجدد تا ' + Math.floor(Store.authCountdown / 60) + ':' + String(Store.authCountdown % 60).padStart(2, "0") + ' دیگر</span>';
          else
            el.parentElement.innerHTML = '<button type="button" data-action="resend-otp" style="color:var(--c-gold-600);font-weight:600">ارسال مجدد کد</button>';
        }
      }, 1000);
    }

    /* ---------- 15. INIT ---------- */
    window.addEventListener("hashchange", renderApp);
    if (document.readyState !== "loading") {
      if (!window.location.hash) window.location.hash = "#/public/home";
      renderApp();
    } else {
      window.addEventListener("DOMContentLoaded", () => {
        if (!window.location.hash) window.location.hash = "#/public/home";
        renderApp();
      });
    }
  </script>
</body>

</html>
